[workspace]
members = [
    "crates/bloqade-lanes-bytecode-core",
    "crates/bloqade-lanes-bytecode-python",
    "crates/bloqade-lanes-bytecode-cli",
    "crates/bloqade-lanes-dsl-core",
    "crates/bloqade-lanes-search",
]
resolver = "2"

[workspace.package]
version = "0.12.0-dev"

[workspace.dependencies]
# vihaco — virtual ISA + machine framework (QuEra, MIT).
# See https://github.com/QuEraComputing/bloqade-lanes/issues/769.
#
# `vihaco-cpu` supplies the `CPU` component composed alongside our own device
# (see `isa::machine`). Note it carries no binary codec of its own — see
# `isa::bytecode` for the mirror ISA that encoding goes through.
#
# Pinned exactly, not caret-matched. vihaco reports container faults as
# free-form `eyre` messages, so `isa::program::classify` recovers the code
# region's length by scraping one of them; a reworded patch release would
# silently downgrade `UnalignedCodeError` to a generic decode error. Bump
# deliberately, with the round-trip tests as the gate.
vihaco = "=0.4.1"
vihaco-cpu = "=0.4.1"
vihaco-parser = "=0.4.1"
chumsky = "0.10"
eyre = "0.6"
