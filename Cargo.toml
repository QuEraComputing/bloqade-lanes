[workspace]
members = [
    "crates/bloqade-lanes-bytecode-core",
    "crates/bloqade-lanes-bytecode-python",
    "crates/bloqade-lanes-bytecode-cli",
    "crates/bloqade-lanes-dsl-core",
    "crates/bloqade-lanes-search",
]
resolver = "2"

[workspace.package]
version = "0.12.0-dev"

[workspace.dependencies]
# vihaco — virtual ISA + machine framework (QuEra, MIT).
# See https://github.com/QuEraComputing/bloqade-lanes/issues/769.
#
# `vihaco-cpu` is deliberately absent: as of 0.4 it is a *runtime component*
# (a CPU you plug into a machine) with no binary codec — its instructions
# implement neither `WriteBytes`/`FromBytes` nor `OpCode` — so the stack ops we
# use are declared natively in our own ISA instead. See `isa::def`.
vihaco = "0.4"
vihaco-parser = "0.4"
chumsky = "0.10"
eyre = "0.6"
