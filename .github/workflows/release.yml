name: Publish Python distribution to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build wheels only — skip publish and release"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build wheel (${{ matrix.target }} on ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Build the CLI crate and stage C lib artifacts before maturin
      # runs, so they get included in the wheel via data = "dist-data".
      - name: Build CLI + C library
        if: ${{ !startsWith(matrix.target, 'aarch64-unknown-linux') }}
        shell: bash
        run: just build-cli stage-clib

      # For Linux aarch64 cross-compilation, the CLI crate must be
      # cross-compiled separately since maturin-action handles PyO3
      # in a container but stage-clib runs on the host.
      - name: Install aarch64 cross-compilation toolchain
        if: ${{ startsWith(matrix.target, 'aarch64-unknown-linux') }}
        run: |
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build CLI + C library (Linux aarch64 cross)
        if: ${{ startsWith(matrix.target, 'aarch64-unknown-linux') }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release -p bloqade-lanes-bytecode-cli --target aarch64-unknown-linux-gnu
          just stage-clib target/aarch64-unknown-linux-gnu/release

      # Temporarily add data directive so maturin includes dist-data/ in the wheel.
      - name: Patch pyproject.toml for bundled artifacts
        run: uv run python scripts/patch_pyproject_data.py patch

      # manylinux_2_28 targets glibc 2.28+ (AlmaLinux 8 / Ubuntu 20.04+).
      # Ignored on non-Linux platforms.
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: "2_28"

      - name: Restore pyproject.toml
        run: uv run python scripts/patch_pyproject_data.py restore

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  # Build source distribution (platform-independent)
  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish-to-pypi:
    name: Publish to PyPI
    if: ${{ startsWith(github.ref, 'refs/tags/') && !inputs.dry_run }}
    needs: [build, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bloqade-lanes
    permissions:
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true

  github-release:
    name: Sign and create GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/') && !inputs.dry_run }}
    needs: [publish-to-pypi]
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      # Full history + tags are needed to compute the previous-tag comparison
      # base below; the release job otherwise has no checkout.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Sign with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.4.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl

      # Generate the release body from GitHub's "generate release notes" API
      # (grouped per .github/release.yml), but pin the comparison base to the
      # previous tag on this release line and strip author attribution before
      # publishing.
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Deterministic comparison base = the previous tag on this release
          # line. Tier 1: the newest tag that is an ancestor of the released
          # commit (the previous patch on a release branch). Tier 2: for a .0
          # release with no earlier tag on its own branch, the global
          # version-sorted predecessor.
          PREV_TAG="$(git tag --sort=-v:refname --merged HEAD | grep -vFx "$TAG" | head -n1 || true)"
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG="$(git tag --sort=-v:refname | awk -v t="$TAG" 'found{print; exit} $0==t{found=1}')"
          fi

          # Generate notes for TAG (respecting .github/release.yml categories),
          # pinned to PREV_TAG so the range never drifts to an unrelated tag.
          if [ -n "$PREV_TAG" ]; then
            echo "Generating notes for ${PREV_TAG}..${TAG}"
            gh api --method POST "repos/${REPO}/releases/generate-notes" \
              -f tag_name="$TAG" -f previous_tag_name="$PREV_TAG" --jq '.body' > notes.raw.md
          else
            echo "No previous tag found; generating notes from repository start"
            gh api --method POST "repos/${REPO}/releases/generate-notes" \
              -f tag_name="$TAG" --jq '.body' > notes.raw.md
          fi

          python3 scripts/clean_release_notes.py < notes.raw.md > notes.md

          gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes-file notes.md

      - name: Upload artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release upload
          '${{ github.ref_name }}' dist/**
          --repo '${{ github.repository }}'
